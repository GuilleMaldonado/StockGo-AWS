services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockgo
      POSTGRES_USER: stockgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U stockgo -d stockgo']
      interval: 10s
      timeout: 5s
      retries: 10
    # La base no publica su puerto al exterior.
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_USER: stockgo
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      DB_NAME: stockgo
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://127.0.0.1:8081}
      PROVISIONING_KEY: ${PROVISIONING_KEY:?Configura PROVISIONING_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8082,http://localhost:8082}
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      PORT: 8081
    ports:
      - '127.0.0.1:8081:8081'
  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./frontend_web/dist:/usr/share/nginx/html:ro
    ports:
      - '127.0.0.1:8082:80'
volumes:
  postgres_data:
