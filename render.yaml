services:
  - type: web
    name: stockgo-api-guille-618
    runtime: docker
    plan: free
    region: oregon
    branch: codex/aws-postgresql
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Cada commit validado en esta rama actualiza la API central.
    autoDeployTrigger: 'commit'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockgo-guille-618-db
          property: connectionString
      - key: PROVISIONING_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: stockgo-web-guille-618
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_SSLMODE
        value: require
      - key: DB_POOL_SIZE
        value: '3'
      - key: DB_MAX_OVERFLOW
        value: '2'
      - key: WEB_CONCURRENCY
        value: '1'
      - key: FORWARDED_ALLOW_IPS
        value: '*'
  - type: web
    name: stockgo-web-guille-618
    runtime: static
    rootDir: frontend_web
    buildCommand: python build.py
    staticPublishPath: ./dist
    autoDeployTrigger: 'commit'
    envVars:
      - key: STOCKGO_API_URL
        fromService:
          name: stockgo-api-guille-618
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
databases:
  - name: stockgo-guille-618-db
    plan: free
    region: oregon
    databaseName: stockgo
    user: stockgo
    postgresMajorVersion: '17'
