services:
  - type: web
    name: stockgo-cloud-demo
    runtime: docker
    plan: free
    region: oregon
    branch: codex/aws-postgresql
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockgo-demo-db
          property: connectionString
      - key: PROVISIONING_KEY
        generateValue: true
      - key: DB_SSLMODE
        value: require
      - key: DB_POOL_SIZE
        value: '3'
      - key: DB_MAX_OVERFLOW
        value: '2'
      - key: WEB_CONCURRENCY
        value: '1'
      - key: FORWARDED_ALLOW_IPS
        value: '*'
databases:
  - name: stockgo-demo-db
    plan: free
    region: oregon
    databaseName: stockgo
    user: stockgo
    postgresMajorVersion: '17'
